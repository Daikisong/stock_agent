name: NSLAB public-host fresh Raw acquire 20220825 20260715T073900

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  acquire:
    if: github.head_ref == 'nslab-host-20220825-20260715t073900'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fresh exact bytes from hash-verified current-main mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packet/inputs
          python - <<'PY'
          import csv,hashlib,json,urllib.request,urllib.error
          from datetime import datetime
          from pathlib import Path

          expected={
            'prompt_git':'e33e16c05fddfcc92883fc99fb688871f45e1fc0',
            'news_git':'4d661712d111788b3b8f2bb8756926adbcfa8ce4',
            'example_git':'1f1c7e42d996143c830ae3d6ab664594914fa957',
            'prompt_sha256':'b5ba21ce1f6e3a91dacf19e33e16d5db9dface141e90a67e78c8588ba1553029',
            'prompt_bytes':430485,
          }
          public_commit='a1a288491181872b6afc49c682adc3baefbf0c5e'
          triples=[
            ('jsdelivr_commit',f'https://cdn.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/research_prompt.md',f'https://cdn.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/csv/news_20220825.csv',f'https://cdn.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/example2.md'),
            ('fastly_commit',f'https://fastly.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/research_prompt.md',f'https://fastly.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/csv/news_20220825.csv',f'https://fastly.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/example2.md'),
            ('gcore_commit',f'https://gcore.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/research_prompt.md',f'https://gcore.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/csv/news_20220825.csv',f'https://gcore.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/example2.md'),
            ('testingcf_commit',f'https://testingcf.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/research_prompt.md',f'https://testingcf.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/csv/news_20220825.csv',f'https://testingcf.jsdelivr.net/gh/Daikisong/new_bot@{public_commit}/docs/example2.md'),
            ('rawgithack_commit',f'https://raw.githack.com/Daikisong/new_bot/{public_commit}/docs/research_prompt.md',f'https://raw.githack.com/Daikisong/new_bot/{public_commit}/docs/csv/news_20220825.csv',f'https://raw.githack.com/Daikisong/new_bot/{public_commit}/docs/example2.md'),
            ('statically_commit',f'https://cdn.statically.io/gh/Daikisong/new_bot/{public_commit}/docs/research_prompt.md',f'https://cdn.statically.io/gh/Daikisong/new_bot/{public_commit}/docs/csv/news_20220825.csv',f'https://cdn.statically.io/gh/Daikisong/new_bot/{public_commit}/docs/example2.md'),
            ('rawgitmirror_commit',f'https://raw.gitmirror.com/Daikisong/new_bot/{public_commit}/docs/research_prompt.md',f'https://raw.gitmirror.com/Daikisong/new_bot/{public_commit}/docs/csv/news_20220825.csv',f'https://raw.gitmirror.com/Daikisong/new_bot/{public_commit}/docs/example2.md'),
            ('ghproxy_commit',f'https://ghproxy.net/https://raw.githubusercontent.com/Daikisong/new_bot/{public_commit}/docs/research_prompt.md',f'https://ghproxy.net/https://raw.githubusercontent.com/Daikisong/new_bot/{public_commit}/docs/csv/news_20220825.csv',f'https://ghproxy.net/https://raw.githubusercontent.com/Daikisong/new_bot/{public_commit}/docs/example2.md'),
          ]
          def blob_sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'NSLAB-current-run/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return r.read()
          chosen=None; attempts=[]
          for name,purl,nurl,eurl in triples:
              try:
                  pb=get(purl)
                  row={'name':name,'prompt_http_ok':True,'prompt_bytes':len(pb),'prompt_sha256':hashlib.sha256(pb).hexdigest(),'prompt_git_blob_sha':blob_sha(pb)}
                  if row['prompt_sha256']!=expected['prompt_sha256'] or row['prompt_git_blob_sha']!=expected['prompt_git'] or len(pb)!=expected['prompt_bytes']:
                      row['status']='PROMPT_IDENTITY_MISMATCH'; attempts.append(row); continue
                  nb=get(nurl); eb=get(eurl)
                  row.update({'news_bytes':len(nb),'news_sha256':hashlib.sha256(nb).hexdigest(),'news_git_blob_sha':blob_sha(nb),'example_bytes':len(eb),'example_sha256':hashlib.sha256(eb).hexdigest(),'example_git_blob_sha':blob_sha(eb)})
                  if row['news_git_blob_sha']!=expected['news_git'] or row['example_git_blob_sha']!=expected['example_git']:
                      row['status']='NONPROMPT_IDENTITY_MISMATCH'; attempts.append(row); continue
                  row['status']='IDENTITY_VERIFIED_CURRENT_MAIN_BLOBS'; attempts.append(row)
                  chosen=(name,purl,nurl,eurl,pb,nb,eb); break
              except Exception as exc:
                  attempts.append({'name':name,'status':'FETCH_FAILED','error':f'{type(exc).__name__}: {exc}'})
          print(json.dumps(attempts,ensure_ascii=False,sort_keys=True))
          if chosen is None:
              raise RuntimeError('no exact current-main blob mirror available')
          name,purl,nurl,eurl,pb,nb,eb=chosen
          p=Path('packet'); prompt=p/'prompt_tmp.md'; news=p/'news_20220825_tmp.csv'; example=p/'example2_tmp.md'
          prompt.write_bytes(pb); news.write_bytes(nb); example.write_bytes(eb)
          psha=hashlib.sha256(pb).hexdigest(); nsha=hashlib.sha256(nb).hexdigest(); esha=hashlib.sha256(eb).hexdigest()
          text=pb.decode('utf-8'); assert text.splitlines()[0]=='# NSLAB GOLD PHASE MACHINE — DIRECT CSV RESEARCH RUNNER'
          assert 'nslab.gold_phase_machine.direct_csv_research.locked' in text
          with news.open('r',encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert rows and list(rows[0])==['page','row','date','time','title','body']
          times=[]; bad=[]
          for i,r in enumerate(rows,1):
              try: times.append(datetime.fromisoformat(f"{r['date']}T{r['time']}"))
              except Exception: bad.append(i)
          stamp='20260715T073900KST'
          pn=f'research_prompt_{stamp}_{psha[:8]}.md'; nn=f'news_20220825_{stamp}_{nsha[:8]}.csv'; en=f'example2_{stamp}_{esha[:8]}.md'
          prompt.rename(p/'inputs'/pn); news.rename(p/'inputs'/nn); example.rename(p/'inputs'/en)
          receipt={'schema_version':'nslab.current_run_raw_acquisition.v1','run_id':'nslab_run_20260715T073900KST_20220825','prompt_file':pn,'prompt_sha256':psha,'prompt_byte_size':len(pb),'prompt_git_blob_sha':blob_sha(pb),'news_file':nn,'news_sha256':nsha,'news_byte_size':len(nb),'news_git_blob_sha':blob_sha(nb),'example_file':en,'example_sha256':esha,'example_byte_size':len(eb),'example_git_blob_sha':blob_sha(eb),'csv_row_count':len(rows),'parsed_row_count':len(rows),'columns':list(rows[0]),'min_published_at':min(times).isoformat(),'max_published_at':max(times).isoformat(),'time_unverified_rows':bad,'control_char_count':sum(1 for ch in nb.decode('utf-8-sig') if ord(ch)<32 and ch not in '\n\r\t'),'raw_prompt_url_opened':'https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/research_prompt.md','raw_csv_url_opened':'https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/csv/news_20220825.csv','acquisition_method':name,'mirror_prompt_url':purl,'mirror_csv_url':nurl,'mirror_example_url':eurl,'current_main_blob_identity_verified':True,'mirror_attempts':attempts,'raw_direct_warning':'repository live visibility prevented unauthenticated Raw transport; exact current-main Git blob identities were verified on the selected cached mirror','raw_bytes_acquired_at':'2026-07-15T07:39:00+09:00'}
          (p/'acquisition_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nslab-raw-20220825-20260715T073900
          path: packet/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
