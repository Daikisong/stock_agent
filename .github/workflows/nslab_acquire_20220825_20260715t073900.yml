name: NSLAB public-host fresh Raw acquire 20220825 20260715T083457

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  acquire:
    if: github.head_ref == 'nslab-host-20220825-20260715t073900'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download exact current-main Raw bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packet/inputs
          STAMP=20260715T083457KST
          curl -fL --retry 3 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' 'https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/research_prompt.md?nslab_run=20260715T083457KST' -o packet/prompt_tmp.md
          curl -fL --retry 3 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' 'https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/csv/news_20220825.csv?nslab_run=20260715T083457KST' -o packet/news_20220825_tmp.csv
          curl -fL --retry 3 --retry-all-errors -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' 'https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/example2.md?nslab_run=20260715T083457KST' -o packet/example2_tmp.md
          python - <<'PY'
          import csv,hashlib,json
          from datetime import datetime
          from pathlib import Path
          p=Path('packet'); prompt=p/'prompt_tmp.md'; news=p/'news_20220825_tmp.csv'; example=p/'example2_tmp.md'
          pb=prompt.read_bytes(); nb=news.read_bytes(); eb=example.read_bytes()
          psha=hashlib.sha256(pb).hexdigest(); nsha=hashlib.sha256(nb).hexdigest(); esha=hashlib.sha256(eb).hexdigest()
          assert psha=='b5ba21ce1f6e3a91dacf19e33e16d5db9dface141e90a67e78c8588ba1553029', psha
          assert len(pb)==430485, len(pb)
          text=pb.decode('utf-8')
          assert text.splitlines()[0]=='# NSLAB GOLD PHASE MACHINE — DIRECT CSV RESEARCH RUNNER'
          assert 'nslab.gold_phase_machine.direct_csv_research.locked' in text
          with news.open('r',encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert rows and list(rows[0])==['page','row','date','time','title','body']
          times=[]; bad=[]
          for i,r in enumerate(rows,1):
              try: times.append(datetime.fromisoformat(f"{r['date']}T{r['time']}"))
              except Exception: bad.append(i)
          stamp='20260715T083457KST'
          pn=f'research_prompt_{stamp}_{psha[:8]}.md'; nn=f'news_20220825_{stamp}_{nsha[:8]}.csv'; en=f'example2_{stamp}_{esha[:8]}.md'
          prompt.rename(p/'inputs'/pn); news.rename(p/'inputs'/nn); example.rename(p/'inputs'/en)
          receipt={
            'schema_version':'nslab.current_run_raw_acquisition.v1',
            'run_id':'nslab_run_20260715T083457KST_20220825',
            'prompt_file':pn,'prompt_sha256':psha,'prompt_byte_size':len(pb),
            'news_file':nn,'news_sha256':nsha,'news_byte_size':len(nb),
            'example_file':en,'example_sha256':esha,'example_byte_size':len(eb),
            'csv_row_count':len(rows),'parsed_row_count':len(rows),'columns':list(rows[0]),
            'min_published_at':min(times).isoformat(),'max_published_at':max(times).isoformat(),
            'time_unverified_rows':bad,
            'control_char_count':sum(1 for ch in nb.decode('utf-8-sig') if ord(ch)<32 and ch not in '\n\r\t'),
            'raw_prompt_url':'https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/research_prompt.md',
            'raw_csv_url':'https://raw.githubusercontent.com/Daikisong/new_bot/refs/heads/main/docs/csv/news_20220825.csv',
            'acquisition_method':'web_raw_open_then_public_host_direct_raw_download',
            'raw_bytes_acquired_at':'2026-07-15T08:34:57+09:00'
          }
          (p/'acquisition_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload fresh current-run packet
        uses: actions/upload-artifact@v4
        with:
          name: nslab-raw-20220825-20260715T083457
          path: packet/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
