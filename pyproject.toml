[project]
name = "stock-agent-e2r"
version = "0.1.0"
description = "E2R 2.0 rerating detection and monitoring agent"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23.0,<5",
    "pdfplumber>=0.11.0,<0.12",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
pro-first = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.52.1,<1",
    "playwright>=1.62.0,<2",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
